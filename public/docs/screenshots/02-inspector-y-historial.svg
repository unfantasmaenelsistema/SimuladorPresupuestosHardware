<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <rect width="1200" height="660" rx="14" fill="#020617" stroke="#1e293b" stroke-width="2" />

  <!-- Left Column: Budget Control & Build History (Undo/Redo) -->
  <rect x="24" y="24" width="560" height="270" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="46" y="54" fill="#94a3b8" font-size="12" class="sans">Control Económico en Tiempo Real</text>
  <text x="46" y="76" fill="#f8fafc" font-size="18" font-weight="700" class="sans">Presupuesto de la Torre (Gaming 1440p)</text>
  <text x="560" y="64" fill="#34d399" font-size="26" font-weight="700" text-anchor="end" class="mono">1.353 €</text>
  <text x="560" y="82" fill="#94a3b8" font-size="12" text-anchor="end" class="mono">Límite: 1.450 €</text>

  <rect x="46" y="98" width="514" height="12" rx="6" fill="#1e293b" />
  <rect x="46" y="98" width="470" height="12" rx="6" fill="#10b981" />
  <text x="46" y="128" fill="#34d399" font-size="12" font-weight="600" class="mono">Margen disponible: +97 €</text>
  <text x="560" y="128" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="end" class="mono">Nota Rúbrica: 9.8 / 10</text>

  <!-- Quick Component Summary -->
  <line x1="46" y1="142" x2="560" y2="142" stroke="#1e293b" />
  <text x="46" y="164" fill="#cbd5e1" font-size="12" class="mono">1. CPU: AMD Ryzen 5 7600X (AM5) ........................... 205 €</text>
  <text x="46" y="186" fill="#cbd5e1" font-size="12" class="mono">2. Placa Base: Gigabyte B650 GAMING X AX V2 ............... 168 €</text>
  <text x="46" y="208" fill="#cbd5e1" font-size="12" class="mono">3. RAM: Corsair Vengeance 32GB (2x16GB) DDR5-6000 ......... 114 €</text>
  <text x="46" y="230" fill="#cbd5e1" font-size="12" class="mono">4. Disipador: Thermalright Peerless Assassin 120 SE ........ 39 €</text>
  <text x="46" y="252" fill="#cbd5e1" font-size="12" class="mono">5. GPU: PowerColor Hellhound RX 7800 XT 16GB .............. 499 €</text>
  <text x="46" y="274" fill="#cbd5e1" font-size="12" class="mono">6-9. NVMe 1TB (74€) + Chasis 4000D (89€) + PSU 750W (89€)</text>

  <!-- History Undo/Redo Card -->
  <rect x="24" y="310" width="560" height="326" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="46" y="340" fill="#94a3b8" font-size="12" class="sans">Control de Versiones del Montaje (Ctrl+Z / Ctrl+Y)</text>
  <text x="46" y="362" fill="#f8fafc" font-size="17" font-weight="700" class="sans">Historial de Cambios (5/5)</text>

  <rect x="376" y="334" width="90" height="30" rx="6" fill="#1e293b" />
  <text x="421" y="353" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="sans">↶ Deshacer</text>
  <rect x="474" y="334" width="86" height="30" rx="6" fill="#1e293b" />
  <text x="517" y="353" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" class="sans">↷ Rehacer</text>

  <!-- Timeline Entries -->
  <rect x="46" y="382" width="514" height="52" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" />
  <text x="60" y="400" fill="#38bdf8" font-size="11" font-weight="700" class="mono">#5 · 10:14:22 · Estado Actual</text>
  <text x="60" y="420" fill="#f8fafc" font-size="12" font-weight="600" class="sans">Cambiado Disipador: Thermalright Peerless Assassin 120 SE (155 mm)</text>
  <text x="544" y="414" fill="#34d399" font-size="12" font-weight="700" text-anchor="end" class="mono">1.353 € ✓</text>

  <rect x="46" y="444" width="514" height="52" rx="8" fill="#020617" stroke="#f43f5e" />
  <text x="60" y="462" fill="#f43f5e" font-size="11" font-weight="700" class="mono">#4 · 10:13:50 · 1 Incompatibilidad Detectada</text>
  <text x="60" y="482" fill="#cbd5e1" font-size="12" class="sans">Instalado Disipador: Noctua NH-D15 (165 mm en caja de 160 mm)</text>
  <text x="544" y="476" fill="#f43f5e" font-size="12" font-weight="700" text-anchor="end" class="mono">1.423 € ⚠ 1</text>

  <rect x="46" y="506" width="514" height="52" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="60" y="524" fill="#64748b" font-size="11" class="mono">#3 · 10:12:15</text>
  <text x="60" y="544" fill="#cbd5e1" font-size="12" class="sans">Instalado Memoria RAM: Corsair Vengeance 32GB (2x16GB) DDR5-6000</text>
  <text x="544" y="538" fill="#34d399" font-size="12" font-weight="700" text-anchor="end" class="mono">1.314 € ✓</text>

  <rect x="46" y="568" width="514" height="52" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="60" y="586" fill="#64748b" font-size="11" class="mono">#2 · 10:11:04</text>
  <text x="60" y="606" fill="#cbd5e1" font-size="12" class="sans">Instalado Placa Base: Gigabyte B650 GAMING X AX V2 (Socket AM5)</text>
  <text x="544" y="600" fill="#34d399" font-size="12" font-weight="700" text-anchor="end" class="mono">1.200 € ✓</text>

  <!-- Right Column: 10-Point Real-Time Compatibility Inspector -->
  <rect x="604" y="24" width="572" height="612" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <text x="628" y="54" fill="#94a3b8" font-size="12" class="sans">Diagnóstico en Tiempo Real (10 Subsistemas)</text>
  <text x="628" y="76" fill="#f8fafc" font-size="18" font-weight="700" class="sans">Inspector de Compatibilidad Física y Lógica</text>

  <!-- Example Error Alert Card -->
  <rect x="628" y="96" width="524" height="128" rx="10" fill="#4c0519" fill-opacity="0.4" stroke="#e11d48" stroke-width="1.5" />
  <text x="646" y="118" fill="#fda4af" font-size="11" font-weight="700" class="mono">GEOMETRÍA DISIPADOR · Medido: 165 mm vs. Máx 160 mm (-5 mm)</text>
  <text x="646" y="140" fill="#f8fafc" font-size="14" font-weight="700" class="sans">✕ Colisión Mecánica: El Disipador No Cabe en la Caja</text>
  <text x="646" y="162" fill="#fecdd3" font-size="12" class="sans">El disipador Noctua NH-D15 mide 165 mm y sobresale 5 mm del límite de la caja.</text>
  <text x="646" y="186" fill="#cbd5e1" font-size="11" class="sans">Explicación didáctica: La altura desde el IHS de la CPU hasta los heatpipes supera</text>
  <text x="646" y="204" fill="#cbd5e1" font-size="11" class="sans">el ancho interior de la semitorre MSI MAG FORGE 100M. ¡No cerrará el cristal lateral!</text>

  <!-- Example Warning Alert Card -->
  <rect x="628" y="236" width="524" height="114" rx="10" fill="#451a03" fill-opacity="0.4" stroke="#d97706" stroke-width="1.5" />
  <text x="646" y="258" fill="#fcd34d" font-size="11" font-weight="700" class="mono">MEMORIA RAM · Medido: 1 módulo (Single Channel) vs. 2 módulos</text>
  <text x="646" y="280" fill="#f8fafc" font-size="14" font-weight="700" class="sans">⚠ Memoria en Single Channel (Ancho de Banda a 64 bits)</text>
  <text x="646" y="302" fill="#fde68a" font-size="12" class="sans">Al instalar 1 solo módulo DIMM se desaprovecha el bus Dual Channel (128 bits),</text>
  <text x="646" y="322" fill="#cbd5e1" font-size="11" class="sans">reduciendo el rendimiento entre un 15% y un 30% en gaming, iGPU y virtualización.</text>

  <!-- Example OK Cards -->
  <rect x="628" y="362" width="524" height="76" rx="10" fill="#020617" stroke="#1e293b" />
  <text x="646" y="384" fill="#34d399" font-size="11" font-weight="700" class="mono">✓ SOCKET Y CHIPSET · AM5 verificado con AMD B650</text>
  <text x="646" y="406" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Zócalo CPU LGA1718 (AM5) y microcódigo UEFI 100% compatibles</text>
  <text x="646" y="424" fill="#94a3b8" font-size="11" class="sans">Etapa de potencia VRM (235W) holgada para sostener los 142W PPT del procesador.</text>

  <rect x="628" y="450" width="524" height="76" rx="10" fill="#020617" stroke="#1e293b" />
  <text x="646" y="472" fill="#34d399" font-size="11" font-weight="700" class="mono">✓ POTENCIA FUENTE (PSU) · Pico 466 W / Raíl +12V 744 W (63%)</text>
  <text x="646" y="494" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Fuente 80 Plus Gold con Margen Seguro ante Picos Transitorios</text>
  <text x="646" y="512" fill="#94a3b8" font-size="11" class="sans">Opera en su curva óptima de eficiencia con conectores PCIe 8 pines dedicados.</text>

  <rect x="628" y="538" width="524" height="76" rx="10" fill="#020617" stroke="#1e293b" />
  <text x="646" y="560" fill="#34d399" font-size="11" font-weight="700" class="mono">✓ FORMATO PLACA/CHASIS Y ALMACENAMIENTO NVMe PCIe 4.0</text>
  <text x="646" y="582" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Estándar ATX (305×244 mm) y Bus M.2 PCIe 4.0 x4 (5.150 MB/s) Verificados</text>
  <text x="646" y="600" fill="#94a3b8" font-size="11" class="sans">Separadores metálicos (standoffs) y ranuras M.2 asignados correctamente.</text>
</svg>
