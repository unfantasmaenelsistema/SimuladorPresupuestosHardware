<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="1200" height="680" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Top Browser / App Bar -->
  <rect x="0" y="0" width="1200" height="54" rx="14" fill="#0f172a" />
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="24" cy="27" r="6" fill="#ef4444" />
  <circle cx="44" cy="27" r="6" fill="#f59e0b" />
  <circle cx="64" cy="27" r="6" fill="#10b981" />
  <text x="95" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Un Fantasma en el Sistema — Simulador de Presupuestos y Compatibilidad SMR</text>
  <rect x="1030" y="14" width="146" height="28" rx="6" fill="#0284c7" />
  <text x="1103" y="32" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" class="sans">unfantasmaenelsistema</text>

  <!-- Main Card Container -->
  <rect x="24" y="74" width="1152" height="582" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Header & POST Button -->
  <text x="48" y="106" fill="#94a3b8" font-size="12" font-weight="500" class="sans">Banco de Pruebas e Inspección Mecánica/Lógica</text>
  <text x="48" y="128" fill="#f8fafc" font-size="19" font-weight="700" class="sans">Esquema Interactivo de Arquitectura de la Torre</text>

  <rect x="890" y="94" width="260" height="36" rx="8" fill="#0284c7" />
  <text x="1020" y="117" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" class="sans">⚡ Simular Encendido POST (BIOS)</text>
  <line x1="48" y1="145" x2="1150" y2="145" stroke="#1e293b" stroke-width="1" />

  <!-- POST Banner (Green Success + EZ-Debug LEDs) -->
  <rect x="48" y="158" width="1102" height="64" rx="10" fill="#064e3b" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" />
  <text x="68" y="182" fill="#34d399" font-size="14" font-weight="700" class="sans">✓ 1 pitido corto (POST Correcto — Sistema Operativo Listo)</text>
  <text x="68" y="204" fill="#cbd5e1" font-size="12" class="sans">POST superado con éxito: AMD Ryzen 5 7600X @ 5.3 GHz · 32 GB DDR5-6000 (Dual Channel) · Salida de vídeo activa y +12V estable.</text>

  <!-- EZ-DEBUG LED Box -->
  <rect x="760" y="169" width="374" height="40" rx="8" fill="#090d16" stroke="#334155" />
  <text x="774" y="193" fill="#94a3b8" font-size="11" font-weight="600" class="mono">EZ-DEBUG LED:</text>
  <rect x="872" y="177" width="58" height="24" rx="4" fill="#064e3b" stroke="#10b981" />
  <text x="901" y="193" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle" class="mono">CPU: OK</text>
  <rect x="936" y="177" width="66" height="24" rx="4" fill="#064e3b" stroke="#10b981" />
  <text x="969" y="193" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle" class="mono">DRAM: OK</text>
  <rect x="1008" y="177" width="58" height="24" rx="4" fill="#064e3b" stroke="#10b981" />
  <text x="1037" y="193" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle" class="mono">VGA: OK</text>
  <rect x="1072" y="177" width="54" height="24" rx="4" fill="#064e3b" stroke="#10b981" />
  <text x="1099" y="193" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle" class="mono">BOOT</text>

