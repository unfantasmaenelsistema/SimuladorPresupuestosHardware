  <rect x="48" y="236" width="720" height="398" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
  <text x="68" y="260" fill="#64748b" font-size="11" class="mono">CHASIS / ENVOLVENTE MECÁNICA: Corsair 4000D Airflow (ATX / Micro-ATX / Mini-ITX)</text>
  <text x="665" y="260" fill="#34d399" font-size="12" font-weight="700" class="sans">✓ Compatible</text>

  <!-- Motherboard PCB Box -->
  <rect x="68" y="274" width="680" height="276" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <text x="84" y="296" fill="#38bdf8" font-size="12" font-weight="700" class="mono">PLACA BASE: Gigabyte B650 GAMING X AX V2 · Socket AM5 · 4x DIMM DDR5 · VRM 235W</text>

  <!-- CPU Slot -->
  <rect x="84" y="310" width="205" height="96" rx="8" fill="#020617" stroke="#334155" />
  <text x="98" y="330" fill="#94a3b8" font-size="11" class="mono">ZÓCALO CPU (AM5)</text>
  <text x="98" y="352" fill="#f8fafc" font-size="13" font-weight="700" class="sans">AMD Ryzen 5 7600X</text>
  <text x="98" y="374" fill="#38bdf8" font-size="11" class="mono">6C/12T · 4.7-5.3 GHz</text>
  <text x="98" y="392" fill="#94a3b8" font-size="11" class="mono">TDP: 105W (PPT 142W)</text>

  <!-- Cooler Slot -->
  <rect x="302" y="310" width="205" height="96" rx="8" fill="#020617" stroke="#334155" />
  <text x="316" y="330" fill="#94a3b8" font-size="11" class="mono">DISIPADOR CPU</text>
  <text x="316" y="352" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Peerless Assassin 120</text>
  <text x="316" y="374" fill="#34d399" font-size="11" class="mono">Altura: 155 mm (Máx 170)</text>
  <text x="316" y="392" fill="#94a3b8" font-size="11" class="mono">Capacidad: 245W TDP</text>

  <!-- RAM DIMM Slot -->
  <rect x="520" y="310" width="212" height="96" rx="8" fill="#020617" stroke="#334155" />
  <text x="534" y="330" fill="#94a3b8" font-size="11" class="mono">BANCOS DIMM (4 SLOTS DDR5)</text>
  <text x="534" y="352" fill="#f8fafc" font-size="13" font-weight="700" class="sans">Corsair 32GB (2x16GB)</text>
  <text x="534" y="372" fill="#38bdf8" font-size="11" class="mono">DDR5-6000 CL30 Dual Ch.</text>
  <!-- 4 DIMM Visual Bars -->
  <rect x="534" y="384" width="42" height="10" rx="2" fill="#0284c7" />
  <rect x="582" y="384" width="42" height="10" rx="2" fill="#0284c7" />
  <rect x="630" y="384" width="42" height="10" rx="2" fill="#1e293b" stroke="#334155" />
  <rect x="678" y="384" width="42" height="10" rx="2" fill="#1e293b" stroke="#334155" />

  <!-- PCIe x16 GPU Slot -->
  <rect x="84" y="420" width="380" height="114" rx="8" fill="#020617" stroke="#334155" />
  <text x="98" y="442" fill="#94a3b8" font-size="11" class="mono">BUS PCIe 4.0 x16 PRINCIPAL / SALIDA DE VÍDEO</text>
  <text x="98" y="468" fill="#f8fafc" font-size="14" font-weight="700" class="sans">Radeon RX 7800 XT Hellhound 16GB GDDR6</text>
  <text x="98" y="492" fill="#38bdf8" font-size="12" class="mono">16 GB VRAM · Longitud: 322 mm (Caja admite 360 mm)</text>
  <text x="98" y="514" fill="#94a3b8" font-size="11" class="mono">TBP: 263W · Conector PCIe 2x 8 pines</text>

  <!-- M.2 & SATA Storage -->
  <rect x="478" y="420" width="254" height="53" rx="8" fill="#020617" stroke="#334155" />
  <text x="492" y="438" fill="#94a3b8" font-size="10" class="mono">M.2 NVMe PRINCIPAL (SO / BOOT)</text>
  <text x="492" y="458" fill="#f8fafc" font-size="12" font-weight="700" class="sans">WD Black SN770 1TB PCIe 4.0</text>

  <rect x="478" y="481" width="254" height="53" rx="8" fill="#020617" stroke="#334155" />
  <text x="492" y="499" fill="#94a3b8" font-size="10" class="mono">UNIDAD SECUNDARIA (DATOS / BACKUP)</text>
  <text x="492" y="519" fill="#94a3b8" font-size="12" class="sans">Seagate IronWolf Pro 4TB SATA</text>

  <!-- PSU Shroud -->
  <rect x="68" y="562" width="680" height="56" rx="8" fill="#0f172a" stroke="#334155" />
  <text x="86" y="584" fill="#fbbf24" font-size="11" font-weight="700" class="mono">⚡ CÁMARA INFERIOR PSU (+12V): Seasonic G12 GC-750 750W 80 Plus Gold</text>
  <text x="86" y="604" fill="#cbd5e1" font-size="12" class="mono">Consumo Pico Sistema: 466 W  |  Raíl +12V Real: 744 W (63% Carga Óptima)</text>

  <!-- Right 4 Cols: Dimensional & Thermal Gauges -->
  <rect x="786" y="236" width="364" height="398" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
  <text x="806" y="264" fill="#f8fafc" font-size="15" font-weight="700" class="sans">Cotas Físicas (mm) y Balance Térmico</text>
  <text x="806" y="282" fill="#64748b" font-size="12" class="sans">Telemetría física y eléctrica en tiempo real</text>
  <line x1="806" y1="294" x2="1130" y2="294" stroke="#1e293b" />

  <!-- Gauge 1 -->
  <text x="806" y="320" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">Altura Disipador vs. Ancho Caja</text>
  <text x="1130" y="320" fill="#f8fafc" font-size="12" text-anchor="end" class="mono">155 mm / 170 mm</text>
  <rect x="806" y="330" width="324" height="10" rx="5" fill="#1e293b" />
  <rect x="806" y="330" width="285" height="10" rx="5" fill="#10b981" />
  <text x="806" y="354" fill="#64748b" font-size="11" class="sans">Holgura libre hasta cristal templado: +15 mm</text>

  <!-- Gauge 2 -->
  <text x="806" y="390" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">Longitud GPU vs. Interior Caja</text>
  <text x="1130" y="390" fill="#f8fafc" font-size="12" text-anchor="end" class="mono">322 mm / 360 mm</text>
  <rect x="806" y="400" width="324" height="10" rx="5" fill="#1e293b" />
  <rect x="806" y="400" width="290" height="10" rx="5" fill="#0ea5e9" />
  <text x="806" y="424" fill="#64748b" font-size="11" class="sans">Espacio libre hasta ventiladores frontales: +38 mm</text>

  <!-- Gauge 3 -->
  <text x="806" y="460" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">Calor CPU (Turbo PPT) vs. Disipador</text>
  <text x="1130" y="460" fill="#f8fafc" font-size="12" text-anchor="end" class="mono">142 W / 245 W</text>
  <rect x="806" y="470" width="324" height="10" rx="5" fill="#1e293b" />
  <rect x="806" y="470" width="188" height="10" rx="5" fill="#10b981" />
  <text x="806" y="494" fill="#64748b" font-size="11" class="sans">Margen térmico de disipación: +103 W sin Throttling</text>

  <!-- Gauge 4 -->
  <text x="806" y="530" fill="#cbd5e1" font-size="12" font-weight="600" class="sans">Carga Eléctrica sobre Fuente (+12V)</text>
  <text x="1130" y="530" fill="#f8fafc" font-size="12" text-anchor="end" class="mono">466 W / 744 W (63%)</text>
  <rect x="806" y="540" width="324" height="10" rx="5" fill="#1e293b" />
  <rect x="806" y="540" width="204" height="10" rx="5" fill="#10b981" />
  <text x="806" y="564" fill="#64748b" font-size="11" class="mono">CPU: 142W | GPU: 263W | Placa/RAM/NVMe: 61W</text>
</svg>
